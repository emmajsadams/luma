name: Work item
description: Agent-ready feature or maintenance task
title: "[Feature] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and scope
      description: Describe the user behavior and explicit non-goals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable checks, including failure paths and browser coverage.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and decisions
      description: Link blocking issues and settle API/data decisions.
  - type: textarea
    id: risk
    attributes:
      label: Security and rollout
      description: Auth, data, secrets, migration, billing and deployment impact. Never paste secrets.
    validations:
      required: true
